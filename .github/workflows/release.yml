name: Release

# Builds the report-server binary for Windows and Linux and attaches both
# as assets to the GitHub release. Triggered when a tag matching v*.*.* is pushed.
# The smoke-test workflow downloads these assets via setup-gman-skills.
#
# To create a release:
#   git tag v0.2.0
#   git push origin v0.2.0
# The workflow builds both binaries and attaches them to a release on that tag.
#
# For manual runs (workflow_dispatch), specify a tag name in the inputs.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach release assets to (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset_name: report-server-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            asset_name: report-server-linux-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install native AOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Publish report-server (native AOT)
        shell: bash
        run: |
          dotnet publish src/report-server/ReportServer/ReportServer.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -o ./publish/${{ matrix.rid }}

      - name: Zip publish output (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/${{ matrix.rid }}/* -DestinationPath ${{ matrix.asset_name }}

      - name: Zip publish output (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd ./publish/${{ matrix.rid }} && zip -r ../../${{ matrix.asset_name }} . && cd ../..

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ matrix.asset_name }}
          fail_on_unmatched_files: true
